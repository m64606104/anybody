<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景 -->
  <rect width="100" height="100" fill="#1e3a8a" rx="20"/>
  
  <!-- 整体旋转15度，避免像百度 -->
  <g transform="translate(50, 50) rotate(15) translate(-50, -50)">
    <!-- 主掌垫（大圆） -->
    <ellipse cx="50" cy="55" rx="18" ry="20" fill="#ffffff"/>
    
    <!-- 四个脚趾（小圆） -->
    <!-- 左上脚趾 - 空心 -->
    <circle cx="35" cy="35" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- 左下脚趾 - 实心 -->
    <circle cx="38" cy="50" r="7" fill="#ffffff"/>
    
    <!-- 右下脚趾 - 实心 -->
    <circle cx="62" cy="50" r="7" fill="#ffffff"/>
    
    <!-- 右上脚趾 - 实心 -->
    <circle cx="65" cy="35" r="8" fill="#ffffff"/>
  </g>
</svg>
