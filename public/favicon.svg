<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 白色背景 -->
  <rect width="100" height="100" fill="#ffffff" rx="20"/>
  
  <!-- 主掌垫（大圆） - 蓝色 -->
  <ellipse cx="50" cy="55" rx="18" ry="20" fill="#3b82f6"/>
  
  <!-- 四个脚趾（小圆） - 蓝色 -->
  <!-- 左上脚趾 -->
  <circle cx="35" cy="35" r="8" fill="#3b82f6"/>
  
  <!-- 左下脚趾 -->
  <circle cx="38" cy="50" r="7" fill="#3b82f6"/>
  
  <!-- 右下脚趾 -->
  <circle cx="62" cy="50" r="7" fill="#3b82f6"/>
  
  <!-- 右上脚趾 -->
  <circle cx="65" cy="35" r="8" fill="#3b82f6"/>
</svg>
