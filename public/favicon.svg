<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 渐变背景 - 从深蓝到靛青 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- 爪子的渐变 - 温暖的橙黄色 -->
    <linearGradient id="pawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="100" height="100" fill="url(#bgGradient)" rx="22"/>
  
  <!-- 小熊爪 - 重新设计，更有特色 -->
  <!-- 主掌垫（心形） -->
  <ellipse cx="50" cy="58" rx="16" ry="18" fill="url(#pawGradient)"/>
  <circle cx="50" cy="52" r="10" fill="url(#pawGradient)"/>
  
  <!-- 四个脚趾垫 - 不对称排列，更有个性 -->
  <!-- 左上 -->
  <ellipse cx="32" cy="38" rx="7" ry="9" fill="url(#pawGradient)" transform="rotate(-15 32 38)"/>
  
  <!-- 中上 -->
  <ellipse cx="50" cy="32" rx="7.5" ry="10" fill="url(#pawGradient)"/>
  
  <!-- 右上 -->
  <ellipse cx="68" cy="38" rx="7" ry="9" fill="url(#pawGradient)" transform="rotate(15 68 38)"/>
  
  <!-- 右侧（稍微靠下） -->
  <ellipse cx="72" cy="52" rx="6.5" ry="8.5" fill="url(#pawGradient)" transform="rotate(25 72 52)"/>
  
  <!-- 添加高光效果，让爪子更立体 -->
  <ellipse cx="48" cy="54" rx="6" ry="7" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="50" cy="30" rx="3" ry="4" fill="#ffffff" opacity="0.4"/>
  
  <!-- 底部装饰性小星星（代表 AI 的智能） -->
  <circle cx="50" cy="78" r="2" fill="#fbbf24" opacity="0.6"/>
  <circle cx="42" cy="76" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <circle cx="58" cy="76" r="1.5" fill="#fbbf24" opacity="0.5"/>
</svg>
